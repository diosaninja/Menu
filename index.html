<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú</title>
<meta name="theme-color" content="#F7EFE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Menú">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7EFE3;--paper:#FFFBF5;--ink:#3A2A1E;--muted:#8B7563;--line:#EADDCB;--soft:#FBF4EA;
  --terra:#C0603A;--terra-d:#A14E2D;--terra-s:#F5DFD2;
  --olive:#6E7F47;--olive-s:#E4E9D3;
  --mus:#C98F26;--mus-s:#F8EBCB;
  --plum:#7D5A7A;--plum-s:#EEE1EC;
  --shadow:0 1px 2px rgba(58,42,30,.06),0 4px 14px rgba(58,42,30,.07);
  --r:16px;--tb:0px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:16px}
body{padding-top:var(--st);padding-bottom:calc(84px + var(--sb) + var(--tb));min-height:100vh;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

header.top{display:flex;align-items:center;gap:12px;padding:18px 22px 6px;max-width:1240px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
header.top .ttl{flex:1}
header.top h1{font-size:32px}
header.top .sub{color:var(--muted);font-size:14px;font-weight:700;margin-top:2px}
main{max-width:1240px;margin:0 auto;padding:6px 22px 24px;padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}

.btn{text-decoration:none;color:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--paper);box-shadow:var(--shadow);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:15px}
.btn.primary{background:var(--terra);color:#fff}
.btn.olive{background:var(--olive);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:#B03A28}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn:active,.icon-btn:active,.chip:active,.rcard:active,.mday:active{transform:scale(.97)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--paper);box-shadow:var(--shadow);display:inline-grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.icon-btn svg{width:22px;height:22px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px}
.grow{flex:1}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:800;color:var(--muted);min-height:38px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.navg{display:flex;align-items:center;gap:8px}
.navlabel{font-family:Fraunces,Georgia,serif;font-size:20px;min-width:190px;text-align:center}

/* Semana */
.week{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.wk-row{display:grid;grid-template-columns:78px repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.wk-row.head{border-top:0;background:var(--soft)}
.wk-row.head>div{padding:11px 6px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.07em;text-align:center;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-desayuno{background:var(--mus)}.d-comida{background:var(--terra)}.d-merienda{background:var(--olive)}.d-cena{background:var(--plum)}
.wk-day{padding:10px 4px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wk-day .wd{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.05em}
.wk-day .dn{font-family:Fraunces,Georgia,serif;font-size:24px;width:40px;height:40px;display:grid;place-items:center}
.wk-row.today .wk-day .dn{background:var(--terra);color:#fff;border-radius:50%;font-size:20px}
.wk-row.today{background:#FFF8EF}
.slot{padding:6px;min-height:80px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0}
.slot:last-child{border-right:0}
.chip{border:0;text-align:left;border-radius:10px;padding:7px 8px;font-size:14px;font-weight:700;line-height:1.2;display:flex;gap:7px;align-items:center;width:100%;min-width:0}
.chip img{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none}
.chip .t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip .sv{margin-left:auto;font-size:11px;opacity:.65;flex:none;font-weight:800}
.chip.free{font-style:italic;font-weight:600}
.m-desayuno{background:var(--mus-s)}.m-comida{background:var(--terra-s)}.m-merienda{background:var(--olive-s)}.m-cena{background:var(--plum-s)}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:10px;color:var(--muted);min-height:34px;font-size:20px;font-weight:700;flex:1;width:100%}
.slot.filled .add{flex:none;min-height:28px;font-size:16px;opacity:.55}
@media (max-width:720px){
  .wk-row{grid-template-columns:52px repeat(4,minmax(0,1fr))}
  .chip{font-size:12px;padding:6px}.chip img{display:none}.chip .sv{display:none}
  .wk-row.head>div{font-size:10px;letter-spacing:0}
  .navlabel{min-width:0;font-size:17px}
  header.top h1{font-size:26px}
}

/* Mes */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{text-align:center;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;padding:4px 0}
.mday{background:var(--paper);border-radius:12px;min-height:108px;padding:6px;box-shadow:var(--shadow);border:0;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.mday.out{opacity:.38}
.mday .n{font-weight:800;font-size:14px;margin-bottom:2px}
.mday.today .n{color:#fff;background:var(--terra);border-radius:20px;padding:0 8px;align-self:flex-start}
.mline{font-size:11px;font-weight:700;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.mday{min-height:70px}.mline{font-size:0;height:6px;padding:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:700;margin-top:12px}

/* Recetas */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:0;padding:8px 14px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);font-weight:800;font-size:14px;min-height:38px}
.fchip.on{background:var(--ink);color:var(--paper)}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;min-height:44px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:16px}
.rcard{border:0;padding:0;text-align:left;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:var(--terra-s) center/cover no-repeat;display:grid;place-items:center;font-size:46px;width:100%}
.rcard .bd{padding:12px 14px 14px}
.rcard h3{font-size:18px;margin:6px 0 6px;line-height:1.2}
.meta{color:var(--muted);font-size:13px;font-weight:700;display:flex;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.b-Desayuno{background:var(--mus-s);color:#8A5F12}.b-Comida{background:var(--terra-s);color:var(--terra-d)}.b-Merienda{background:var(--olive-s);color:#4E5C30}.b-Cena{background:var(--plum-s);color:#5C3F5A}.b-Postre{background:#F6E0E4;color:#93404F}.b-Otro{background:var(--line);color:var(--muted)}

/* Listas */
.list{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:800}
.row .note{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.row .qty{font-weight:800;white-space:nowrap;text-align:right}
.row.done .nm,.row.done .qty{text-decoration:line-through;opacity:.5}
.check{width:28px;height:28px;border-radius:9px;border:2px solid #D8C8B3;background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;padding:0}
.check.on{background:var(--olive);border-color:var(--olive)}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;width:36px;height:36px;border-radius:10px;flex:none}
.sec-title{font-family:Fraunces,Georgia,serif;font-size:21px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:4px}
.count{font-family:Nunito,sans-serif;font-size:13px;background:var(--line);border-radius:20px;padding:2px 10px;font-weight:800}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-weight:600;line-height:1.5}
.addrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--soft);border-top:1px solid var(--line)}
.addrow:first-child{border-top:0}
.in{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-height:44px;min-width:0}
.in.qty{width:86px}.in.unit{width:110px}.in.name{flex:1;min-width:150px}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
.pm{border:0;background:var(--soft);width:36px;height:36px;border-radius:10px;font-weight:900;font-size:18px;color:var(--terra);flex:none}
.qbox{display:flex;align-items:center;gap:6px}
.qbox .qty{min-width:70px;text-align:center}
.zero{color:#B03A28}
details.sec>summary{list-style:none;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .arr{transition:.2s;display:inline-block}
details.sec[open]>summary .arr{transform:rotate(90deg)}
.rangebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.rangebar label{font-weight:800;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

/* Barra de pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,251,245,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + var(--sb));z-index:20}
nav.tabs button{flex:1;max-width:170px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);padding:6px 0;position:relative}
nav.tabs svg{width:26px;height:26px}
nav.tabs button.on{color:var(--terra)}
nav.tabs .tbadge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--terra);color:#fff;font-size:11px;border-radius:10px;padding:0 6px;min-width:18px;line-height:18px}

/* Temporizadores */
#timers{position:fixed;left:0;right:0;bottom:calc(68px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:19;pointer-events:none;padding:0 12px 8px}
.tpill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:30px;padding:5px 6px 5px 16px;box-shadow:0 8px 24px rgba(40,28,20,.25);max-width:560px;width:100%}
.tpill .tl{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.tpill .tt{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;margin-right:4px}
.tpill button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:20px;min-width:40px;height:38px;font-weight:800;padding:0 10px}
.tpill.paused .tt{opacity:.55}
.tpill.done{background:var(--terra);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}

/* Hojas */
.wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(40,28,20,.38);animation:fade .2s}
.sheet{position:relative;background:var(--bg);width:100%;max-width:780px;max-height:94vh;max-height:94dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.narrow{max-width:520px}
@media (min-width:820px){.wrap{align-items:center;padding:20px}.sheet{border-radius:22px;max-height:90vh}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.sheet-body{overflow:auto;padding:16px 18px 22px;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{padding:12px 18px calc(12px + var(--sb));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.stepper{display:inline-flex;align-items:center;background:var(--paper);border-radius:12px;box-shadow:var(--shadow)}
.stepper button{border:0;background:transparent;width:46px;height:46px;font-size:22px;font-weight:800;color:var(--terra)}
.stepper span{min-width:92px;text-align:center;font-weight:800}
.hero{border-radius:var(--r);aspect-ratio:16/9;background:var(--terra-s) center/cover no-repeat;margin-bottom:14px;display:grid;place-items:center;font-size:64px;width:100%}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.time{background:var(--paper);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.time b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px}
.time small{color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btnrow .btn{flex:1;min-width:150px}
.ingl{list-style:none;margin:0;padding:0}
.ingl li{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ingl li:first-child{border-top:0}
.ingl li.done span{text-decoration:line-through;opacity:.5}
.ingl .iq{font-weight:800;min-width:84px;color:var(--terra-d)}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.step p{margin:3px 0 0;line-height:1.55;flex:1;white-space:pre-wrap}
.box{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.box h3{font-size:19px;margin-bottom:8px}
.erow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.erow .in.name{flex:1}
.srow{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.srow .num{margin-top:8px}
.srow textarea{flex:1}
.srow .tm{width:92px}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pitem{display:flex;align-items:center;gap:12px;border:0;background:var(--paper);border-radius:12px;padding:8px;box-shadow:var(--shadow);text-align:left;width:100%}
.pitem .th{width:52px;height:52px;border-radius:10px;background:var(--terra-s) center/cover;display:grid;place-items:center;font-size:24px;flex:none}
.pitem b{display:block}
.mealsec{margin-bottom:14px}
.mealsec .lbl{margin-bottom:6px;display:block}
.mealsec .slot{border:0;padding:0;min-height:0}
.big{font-family:Fraunces,Georgia,serif;font-size:24px;margin-bottom:6px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);font-weight:600;line-height:1.45}
#toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#syncb{border:0;border-radius:20px;padding:6px 12px;font-weight:800;font-size:13px;background:var(--olive-s);color:#4E5C30;white-space:nowrap}
#syncb.wait{background:var(--line);color:var(--muted)}#syncb.err{background:#F6DCD6;color:#B03A28}
#alarm{position:fixed;inset:0;z-index:90;background:rgba(192,96,58,.96);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px}
#alarm .ic{font-size:80px;animation:pulse .8s infinite}
#alarm h2{font-size:34px}
#alarm .btn{background:#fff;color:var(--terra-d);font-size:20px;padding:14px 40px}
</style>
</head>
<body>
<header class="top">
  <div class="ttl"><h1 id="ttl">Menú</h1><div class="sub" id="sub"></div></div>
  <button id="syncb" class="hidden"></button>
  <button class="icon-btn" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="view"></main>
<div id="timers"></div>
<nav class="tabs" id="tabs">
  <button data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Menú</button>

<div id="sheets"></div>
<div id="toast"></div>
<div id="alarm" class="hidden"><div class="ic">⏰</div><h2 id="alarmTxt">¡Tiempo!</h2><button class="btn" id="alarmStop">Parar</button></div>

<script>
'use strict';
/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim().replace(/\s+/g,' ');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const MEALS=[{k:'desayuno',n:'Desayuno'},{k:'comida',n:'Comida'},{k:'merienda',n:'Merienda'},{k:'cena',n:'Cena'}];
const mealName=k=>(MEALS.find(m=>m.k===k)||{}).n||k;
const CATS=['Desayuno','Comida','Merienda','Cena','Postre','Otro'];
const UNITS=['g','kg','ml','l','ud','cda','cdta','taza','diente','rebanada','pizca','al gusto'];
const LOCS=['Despensa','Nevera','Congelador'];
const EMO={Desayuno:'🥐',Comida:'🍲',Merienda:'🍎',Cena:'🥗',Postre:'🍰',Otro:'🍽️'};

/* Fechas */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const startWeek=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const todayS=()=>ymd(new Date());
const fmt=(d,o)=>d.toLocaleDateString('es-ES',o);
const longDay=s=>cap(fmt(parseD(s),{weekday:'long',day:'numeric',month:'long'}));
function rangeLabel(a,b){
  const A=parseD(a),B=parseD(b);
  if(A.getMonth()===B.getMonth()&&A.getFullYear()===B.getFullYear()) return `${A.getDate()} – ${B.getDate()} ${fmt(B,{month:'short'})} ${B.getFullYear()}`;
  return `${A.getDate()} ${fmt(A,{month:'short'})} – ${B.getDate()} ${fmt(B,{month:'short'})} ${B.getFullYear()}`;
}

/* Cantidades */
function parseQty(v){
  if(v==null)return null; v=String(v).trim().replace(',','.'); if(!v)return null;
  let m=v.match(/^(\d+)\s+(\d+)\/(\d+)$/); if(m)return +m[1]+(+m[2])/(+m[3]);
  m=v.match(/^(\d+)\/(\d+)$/); if(m)return (+m[1])/(+m[2]);
  const n=parseFloat(v); return isNaN(n)?null:n;
}
const fromBase=(q,u)=>{const b=toBase(1,u).q;return b?q/b:q};
const num=q=>String(Math.round(q*100)/100).replace('.',',');
function toBase(q,u){
  u=u||'ud';
  if(u==='al gusto')return{q:null,u:'al gusto'};
  if(u==='kg')return{q:q==null?null:q*1000,u:'g'};
  if(u==='l')return{q:q==null?null:q*1000,u:'ml'};
  const ML={cda:15,cdta:5,taza:250};
  if(ML[u])return{q:q==null?null:q*ML[u],u:'ml'};
  return{q,u};
}
function fmtQ(q,u){
  u=u||'ud';
  if(u==='al gusto')return 'al gusto';
  if(q==null)return u==='ud'?'':u;
  if(u==='g'&&q>=1000)return num(q/1000)+' kg';
  if(u==='ml'&&q>=1000)return num(q/1000)+' l';
  return num(q)+' '+u;
}

/* ---------- Almacenamiento (IndexedDB con respaldo) ---------- */
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('menu-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!this.db){try{const v=localStorage.getItem('menu-'+k);return res(v?JSON.parse(v):null)}catch(e){return res(null)}}
    try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  set(k,v){return new Promise(res=>{if(!this.db){try{localStorage.setItem('menu-'+k,JSON.stringify(v))}catch(e){}return res()}
    try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
};
let S=null, saveT=null;
const blank=()=>({v:1,recipes:[],plan:{},pantry:[],manual:[],checked:{},timers:[],sections:{},settings:{people:2}});
function save(){clearTimeout(saveT);saveT=setTimeout(()=>DB.set('state',JSON.parse(JSON.stringify(S))),250);if(typeof SYNC!=='undefined'&&SYNC.on)queuePush()}
const getR=id=>S.recipes.find(r=>r.id===id);

/* ---------- Estado de interfaz ---------- */
const ui={tab:'menu',cal:'semana',cursor:new Date(),cat:'Todas',q:'',pq:'',shopFrom:null,shopTo:null};
try{const t=localStorage.getItem('menu-tab');if(t)ui.tab=t;const c=localStorage.getItem('menu-cal');if(c)ui.cal=c}catch(e){}
function setShopWeek(off){const s=addDays(startWeek(new Date()),7*off);ui.shopFrom=ymd(s);ui.shopTo=ymd(addDays(s,6))}
setShopWeek(0);

/* ---------- Datos de ejemplo ---------- */
function sampleData(){
  const st=blank();
  const r1={id:uid(),sample:true,name:'Tortilla de patatas',cat:'Comida',servings:4,prep:15,cook:25,photo:null,
    ingredients:[{qty:800,unit:'g',name:'Patatas'},{qty:6,unit:'ud',name:'Huevos'},{qty:1,unit:'ud',name:'Cebolla'},{qty:200,unit:'ml',name:'Aceite de oliva'},{qty:null,unit:'al gusto',name:'Sal'}],
    steps:[{text:'Pela y corta las patatas y la cebolla en láminas finas.',min:null},{text:'Fríe a fuego medio en el aceite hasta que estén tiernas.',min:20},{text:'Escurre, mezcla con los huevos batidos y la sal. Deja reposar.',min:5},{text:'Cuaja en la sartén por ambos lados.',min:4}],notes:'Ejemplo: puedes editar o borrar esta receta.'};
  const r2={id:uid(),sample:true,name:'Lentejas estofadas',cat:'Comida',servings:4,prep:15,cook:45,photo:null,
    ingredients:[{qty:400,unit:'g',name:'Lentejas'},{qty:150,unit:'g',name:'Chorizo'},{qty:2,unit:'ud',name:'Zanahoria'},{qty:1,unit:'ud',name:'Cebolla'},{qty:2,unit:'diente',name:'Ajo'},{qty:1,unit:'cdta',name:'Pimentón'},{qty:2,unit:'cda',name:'Aceite de oliva'}],
    steps:[{text:'Pica la cebolla, el ajo y la zanahoria y sofríe en el aceite.',min:8},{text:'Añade el chorizo en rodajas y el pimentón.',min:2},{text:'Incorpora las lentejas, cubre con agua y cuece a fuego lento.',min:40}],notes:''};
  const r3={id:uid(),sample:true,name:'Tostadas con tomate',cat:'Desayuno',servings:2,prep:5,cook:3,photo:null,
    ingredients:[{qty:4,unit:'rebanada',name:'Pan'},{qty:2,unit:'ud',name:'Tomate'},{qty:2,unit:'cda',name:'Aceite de oliva'},{qty:null,unit:'al gusto',name:'Sal'}],
    steps:[{text:'Tuesta el pan.',min:3},{text:'Ralla el tomate, unta, aliña con aceite y sal.',min:null}],notes:''};
  st.recipes=[r1,r2,r3];
  st.pantry=[{id:uid(),sample:true,name:'Aceite de oliva',qty:1,unit:'l',loc:'Despensa'},{id:uid(),sample:true,name:'Sal',qty:null,unit:'ud',loc:'Despensa'},{id:uid(),sample:true,name:'Huevos',qty:4,unit:'ud',loc:'Nevera'},{id:uid(),sample:true,name:'Lentejas',qty:500,unit:'g',loc:'Despensa'}];
  const t=todayS(),m=ymd(addDays(new Date(),1));
  st.plan[t]={desayuno:[{id:uid(),recipeId:r3.id,servings:2}],comida:[{id:uid(),recipeId:r1.id,servings:2}],merienda:[],cena:[{id:uid(),text:'Ensalada',servings:2}]};
  st.plan[m]={desayuno:[],comida:[{id:uid(),recipeId:r2.id,servings:4}],merienda:[],cena:[]};
  st.hasSample=true;
  return st;
}

/* ---------- Plan ---------- */
function dayPlan(d,create){if(!S.plan[d]){if(!create)return null;S.plan[d]={desayuno:[],comida:[],merienda:[],cena:[]}}return S.plan[d]}
const entries=(d,m)=>{const p=S.plan[d];return p&&p[m]?p[m]:[]};
function entryName(e){if(e.recipeId){const r=getR(e.recipeId);return r?r.name:'(receta borrada)'}return e.text||''}
function cleanDay(d){const p=S.plan[d];if(p&&MEALS.every(m=>!(p[m.k]||[]).length))delete S.plan[d]}

/* ---------- Toast y confirmación ---------- */
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
function ask(msg,ok='Aceptar',danger=true){return new Promise(res=>{
  let done=false;
  openSheet({title:'¿Seguro?',narrow:true,body:()=>`<p style="line-height:1.5;margin:0 0 6px">${esc(msg)}</p>`,
    foot:()=>`<button class="btn" data-no>Cancelar</button><button class="btn ${danger?'primary':'olive'}" data-yes>${esc(ok)}</button>`,
    mount:r=>{$('[data-no]',r).onclick=()=>{done=true;closeSheet();res(false)};$('[data-yes]',r).onclick=()=>{done=true;closeSheet();res(true)}},
    onClose:()=>{if(!done)res(false)}});
})}

/* ---------- Hojas (ventanas) ---------- */
const stack=[];let lastCfg=null;
function openSheet(cfg){stack.push(cfg);drawSheets(true)}
function closeSheet(){const c=stack.pop();if(c&&c.onClose)c.onClose();drawSheets(true);render()}
function closeAll(){while(stack.length){const c=stack.pop();if(c.onClose)c.onClose()}drawSheets(true);render()}
function drawSheets(reset){
  const host=$('#sheets');
  if(!stack.length){host.innerHTML='';document.body.classList.remove('locked');lastCfg=null;return}
  const c=stack[stack.length-1];
  const prev=$('.sheet-body',host);const st=(!reset&&prev&&lastCfg===c)?prev.scrollTop:0;
  const title=typeof c.title==='function'?c.title():c.title;
  host.innerHTML=`<div class="wrap"><div class="backdrop"></div><div class="sheet ${c.narrow?'narrow':''}"><div class="sheet-head"><button class="icon-btn" data-close aria-label="Cerrar">${stack.length>1?'‹':'✕'}</button><h2>${esc(title)}</h2>${c.head?c.head():''}</div><div class="sheet-body">${c.body()}</div>${c.foot?`<div class="sheet-foot">${c.foot()}</div>`:''}</div></div>`;
  document.body.classList.add('locked');
  const root=$('.sheet',host);
  $('.backdrop',host).onclick=closeSheet;$('[data-close]',host).onclick=closeSheet;
  if(c.mount)c.mount(root);
  $('.sheet-body',host).scrollTop=st;lastCfg=c;
}
const refresh=()=>drawSheets(false);

/* ---------- Render principal ---------- */
const TITLES={menu:['Menú','Planifica tus comidas'],recetas:['Recetario','Tus recetas'],compra:['Lista de la compra','Calculada con tu menú y tu despensa'],despensa:['Despensa','Lo que ya tienes en casa']};
function render(){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  $('#ttl').textContent=TITLES[ui.tab][0];$('#sub').textContent=TITLES[ui.tab][1];
  const v=$('#view');
  if(ui.tab==='menu'){v.innerHTML=renderMenu();mountMenu(v)}
  else if(ui.tab==='recetas'){v.innerHTML=renderRecipes();mountRecipes(v)}
  else if(ui.tab==='compra'){v.innerHTML=renderShop();mountShop(v)}
  else {v.innerHTML=renderPantry();mountPantry(v)}
  updateBadge();
}
function updateBadge(){const n=buildShop().buy.filter(i=>!S.checked[i.key]).length+S.manual.filter(m=>!m.done).length;const b=$('#cbadge');b.textContent=n;b.classList.toggle('hidden',!n)}

/* ===== MENÚ ===== */
function chipHTML(d,m,e){
  const r=e.recipeId?getR(e.recipeId):null;
  const img=r&&r.photo?`<img src="${r.photo}" alt="">`:'';
  return `<button class="chip m-${m} ${e.recipeId?'':'free'}" data-entry="${d}|${m}|${e.id}">${img}<span class="t">${esc(entryName(e))}</span>${e.recipeId?`<span class="sv">${e.servings}p</span>`:''}</button>`;
}
function slotHTML(d,m){const es=entries(d,m);return `<div class="slot ${es.length?'filled':''}">${es.map(e=>chipHTML(d,m,e)).join('')}<button class="add" data-add="${d}|${m}" aria-label="Añadir ${mealName(m)}">+</button></div>`}
function renderMenu(){
  const c=ui.cursor;let label,body;
  if(ui.cal==='semana'){
    const s=startWeek(c);label=rangeLabel(ymd(s),ymd(addDays(s,6)));
    let h=`<div class="week"><div class="wk-row head"><div></div>${MEALS.map(m=>`<div><span class="dot d-${m.k}"></span>${m.n}</div>`).join('')}</div>`;
    for(let i=0;i<7;i++){const d=addDays(s,i),ds=ymd(d);
      h+=`<div class="wk-row ${ds===todayS()?'today':''}"><div class="wk-day"><span class="wd">${fmt(d,{weekday:'short'}).replace('.','')}</span><span class="dn">${d.getDate()}</span></div>${MEALS.map(m=>slotHTML(ds,m.k)).join('')}</div>`}
    body=h+'</div>';
  }else{
    label=cap(fmt(c,{month:'long',year:'numeric'}));
    const first=new Date(c.getFullYear(),c.getMonth(),1),s=startWeek(first),dim=new Date(c.getFullYear(),c.getMonth()+1,0).getDate();
    const weeks=Math.ceil((((first.getDay()+6)%7)+dim)/7);
    let h=`<div class="month">${['lun','mar','mié','jue','vie','sáb','dom'].map(x=>`<div class="mh">${x}</div>`).join('')}`;
    for(let i=0;i<weeks*7;i++){const d=addDays(s,i),ds=ymd(d);
      const lines=MEALS.flatMap(m=>entries(ds,m.k).map(e=>`<div class="mline m-${m.k}">${esc(entryName(e))}</div>`)).join('');
      h+=`<button class="mday ${d.getMonth()!==c.getMonth()?'out':''} ${ds===todayS()?'today':''}" data-day="${ds}"><span class="n">${d.getDate()}</span>${lines}</button>`}
    body=h+`</div><div class="legend">${MEALS.map(m=>`<span><span class="dot d-${m.k}"></span>${m.n}</span>`).join('')}</div>`;
  }
  return `<div class="toolbar"><div class="seg"><button data-cal="semana" class="${ui.cal==='semana'?'on':''}">Semana</button><button data-cal="mes" class="${ui.cal==='mes'?'on':''}">Mes</button></div>
  <div class="navg"><button class="icon-btn" data-nav="-1" aria-label="Anterior">‹</button><div class="navlabel">${label}</div><button class="icon-btn" data-nav="1" aria-label="Siguiente">›</button></div>
  <button class="btn sm" data-today>Hoy</button><span class="grow"></span>${ui.cal==='semana'?'<button class="btn sm" data-wtools>Opciones de la semana</button>':''}</div>${body}`;
}
function bindSlots(root){
  $$('[data-add]',root).forEach(b=>b.onclick=()=>{const[d,m]=b.dataset.add.split('|');openPicker(d,m)});
  $$('[data-entry]',root).forEach(b=>b.onclick=()=>{const[d,m,id]=b.dataset.entry.split('|');openEntry(d,m,id)});
}
function mountMenu(v){
  bindSlots(v);
  $$('[data-cal]',v).forEach(b=>b.onclick=()=>{ui.cal=b.dataset.cal;try{localStorage.setItem('menu-cal',ui.cal)}catch(e){}render()});
  $$('[data-nav]',v).forEach(b=>b.onclick=()=>{const n=+b.dataset.nav;const c=ui.cursor;ui.cursor=ui.cal==='semana'?addDays(c,7*n):new Date(c.getFullYear(),c.getMonth()+n,1);render()});
  $('[data-today]',v).onclick=()=>{ui.cursor=new Date();render()};
  $$('[data-day]',v).forEach(b=>b.onclick=()=>openDay(b.dataset.day));
  const wt=$('[data-wtools]',v);if(wt)wt.onclick=openWeekTools;
}
function openDay(d){
  openSheet({title:()=>longDay(d),body:()=>MEALS.map(m=>`<div class="mealsec"><span class="lbl"><span class="dot d-${m.k}"></span>${m.n}</span>${slotHTML(d,m.k)}</div>`).join(''),mount:r=>bindSlots(r)});
}
function openPicker(d,m,replaceId){
  const pk={q:'',serv:S.settings.people||2,text:''};
  if(replaceId){const e=entries(d,m).find(x=>x.id===replaceId);if(e)pk.serv=e.servings||pk.serv}
  const list=()=>{
    const q=norm(pk.q);const cat=cap(m);
    const rs=S.recipes.filter(r=>!q||norm(r.name).includes(q)).sort((a,b)=>(b.cat===cat)-(a.cat===cat)||a.name.localeCompare(b.name,'es'));
    if(!rs.length)return `<div class="empty">${S.recipes.length?'No hay recetas con ese nombre.':'Aún no tienes recetas. Créalas en la pestaña Recetas, o escribe un plato abajo.'}</div>`;
    return rs.map(r=>`<button class="pitem" data-pick="${r.id}"><span class="th" style="${r.photo?`background-image:url(${r.photo})`:''}">${r.photo?'':EMO[r.cat]||'🍽️'}</span><span style="flex:1"><b>${esc(r.name)}</b><span class="meta"><span class="badge b-${r.cat}">${r.cat}</span>${totalMin(r)?`<span>⏱ ${totalMin(r)} min</span>`:''}</span></span></button>`).join('');
  };
  openSheet({title:`${replaceId?'Cambiar':'Añadir'} · ${mealName(m)}`,
    body:()=>`<p class="hint" style="margin:0 0 12px">${longDay(d)}</p>
      <div class="field"><label>Raciones</label><div class="stepper"><button data-s="-1">−</button><span id="pkserv">${pk.serv} ${pk.serv==1?'persona':'personas'}</span><button data-s="1">+</button></div></div>
      <input class="search" style="width:100%" placeholder="Buscar receta…" id="pkq" value="${esc(pk.q)}">
      <div class="plist" id="pklist">${list()}</div>
      <div class="box" style="margin-top:18px"><h3>O escribe un plato</h3><p class="hint" style="margin:0 0 10px">Para cosas sin receta: “Comer fuera”, “Sobras”, “Fruta”…</p>
      <div class="erow"><input class="in name" id="pktext" placeholder="Escribe aquí"><button class="btn olive" id="pkadd">Añadir</button></div></div>`,
    mount:r=>{
      $$('[data-s]',r).forEach(b=>b.onclick=()=>{pk.serv=Math.max(1,pk.serv+(+b.dataset.s));$('#pkserv',r).textContent=`${pk.serv} ${pk.serv==1?'persona':'personas'}`});
      const bindList=()=>$$('[data-pick]',r).forEach(b=>b.onclick=()=>put({recipeId:b.dataset.pick}));
      $('#pkq',r).oninput=e=>{pk.q=e.target.value;$('#pklist',r).innerHTML=list();bindList()};
      bindList();
      const addText=()=>{const t=$('#pktext',r).value.trim();if(!t){$('#pktext',r).focus();return}put({text:t})};
      $('#pkadd',r).onclick=addText;$('#pktext',r).onkeydown=e=>{if(e.key==='Enter')addText()};
    }});
  function put(o){
    const arr=dayPlan(d,true)[m];const e={id:uid(),servings:pk.serv,...o};
    if(replaceId){const i=arr.findIndex(x=>x.id===replaceId);if(i>=0){e.id=replaceId;arr[i]=e}else arr.push(e)}else arr.push(e);
    save();closeSheet();if(replaceId)closeSheet();toast(replaceId?'Cambiado':'Añadido al menú');
  }
}
function openEntry(d,m,id){
  const get=()=>entries(d,m).find(x=>x.id===id);
  openSheet({title:mealName(m),narrow:true,
    body:()=>{const e=get();if(!e)return '<div class="empty">Ya no existe.</div>';const r=e.recipeId?getR(e.recipeId):null;
      return `<p class="hint" style="margin:0 0 6px">${longDay(d)}</p><div class="big">${esc(entryName(e))}</div>
      ${r&&r.photo?`<div class="hero" style="background-image:url(${r.photo})"></div>`:''}
      ${e.recipeId?`<div class="field"><label>Raciones</label><div class="stepper"><button data-s="-1">−</button><span>${e.servings} ${e.servings==1?'persona':'personas'}</span><button data-s="1">+</button></div></div>`:''}
      <div class="btnrow">${r?'<button class="btn" data-view>📖 Ver receta</button>':''}<button class="btn" data-change>🔄 Cambiar</button></div>
      <div class="box"><h3>Mover a otro día</h3><div class="erow"><input type="date" class="in" id="mvd" value="${d}"><select class="in" id="mvm">${MEALS.map(x=>`<option value="${x.k}" ${x.k===m?'selected':''}>${x.n}</option>`).join('')}</select><button class="btn olive" data-move>Mover</button></div></div>

const PROXIES=[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
async function fetchVia(url,as){
  for(const P of PROXIES){
    const ac=new AbortController();const t=setTimeout(()=>ac.abort(),12000);
    try{const r=await fetch(P(url),{signal:ac.signal});clearTimeout(t);if(!r.ok)continue;

  }

}

function findRecipe(o){
  if(!o||typeof o!=='object')return null;
  if(Array.isArray(o)){for(const x of o){const r=findRecipe(x);if(r)return r}return null}
  const t=o['@type'];if(t==='Recipe'||(Array.isArray(t)&&t.includes('Recipe')))return o;

  return null;
}
const UMAP=[[/^(kg|kgs|kilo|kilos|kilogramos?)$/,'kg'],[/^(g|gr|grs|gramos?)$/,'g'],[/^(ml|mililitros?|cc)$/,'ml'],[/^(l|lt|litros?)$/,'l'],[/^(cl)$/,'cl'],[/^(cucharaditas?|cdtas?|cdita|cditas|tsp|teaspoons?|cucharadita\(s\))$/,'cdta'],[/^(cucharadas?|cdas?|tbsp|tablespoons?|cucharada\(s\))$/,'cda'],[/^(tazas?|cups?|vasos?)$/,'taza'],[/^(dientes?)$/,'diente'],[/^(rebanadas?|lonchas?|rodajas?)$/,'rebanada'],[/^(pizcas?|pellizcos?)$/,'pizca'],[/^(unidad(es)?|uds?|u)$/,'ud']];

  if(qty!=null){const w=rest.match(/^([a-záéíóúñ()]+)\.?\s*(.*)$/i);
    if(w){const u=UMAP.find(([re])=>re.test(norm(w[1])));if(u){unit=u[1];rest=w[2]}}}
  rest=rest.replace(/^(soperas?|de postre|de café|de cafe|rasas?|colmadas?|grandes?|pequeñas?|medianas?)\s+/i,'');
  const vague=rest.match(/^(chorrit[oa]s?|chorros?|puñad[oa]s?|poc[oa]s?|poquit[oa]s?|ramit[oa]s?|hojas?|trozos?|pellizcos?)\s+(de\s+)?(.*)$/i);
  if(vague&&(qty==null||qty<=1)){return{qty:null,unit:'al gusto',name:cap(vague[3].trim())}}
  rest=rest.replace(/^(de|del)\s+/i,'').trim();
  if(unit==='cl'){qty=qty*10;unit='ml'}
  if(/\b(al gusto|c\/n|cantidad necesaria|a gusto)\b/i.test(rest)&&qty==null){unit='al gusto';rest=rest.replace(/,?\s*(al gusto|c\/n|cantidad necesaria|a gusto)\b/i,'').trim()}
  if(qty==null&&unit==='ud'&&!/\d/.test(s))unit='al gusto';
  rest=rest.replace(/\s+/g,' ').replace(/[.;:]$/,'').trim();

}
function stepMin(t){const h=t.match(/(\d+(?:[.,]\d+)?)\s*(h|horas?)\b/i),m=t.match(/(\d+)\s*(?:-\s*\d+\s*)?(min|minutos?|mins?)\b/i);let n=0;if(h)n+=Math.round(parseFloat(h[1].replace(',','.'))*60);if(m)n+=+m[1];return n||null}

  if(Array.isArray(x))return x.flatMap(flatSteps);
  if(x.itemListElement)return flatSteps(x.itemListElement);
  return x.text?[decodeHTML(x.text)]:(x.name?[decodeHTML(x.name)]:[]);}
function guessCat(c,name){const s=norm([].concat(c||[]).join(' ')+' '+(name||''));
  if(/postre|dessert|tarta|bizcocho|galleta|helado|flan|pastel/.test(s))return 'Postre';if(/desayuno|breakfast|tostada|porridge|tortitas|pancake/.test(s))return 'Desayuno';
  if(/merienda|snack/.test(s))return 'Merienda';if(/cena|dinner/.test(s))return 'Cena';return 'Comida'}
function recipeFromHTML(html,url){
  const doc=new DOMParser().parseFromString(html,'text/html');let R=null;
  for(const sc of doc.querySelectorAll('script[type="application/ld+json"]')){try{const j=JSON.parse(sc.textContent.trim());R=findRecipe(j);if(R)break}catch(e){}}
  const og=p=>{const e=doc.querySelector(`meta[property="${p}"],meta[name="${p}"]`);return e?e.getAttribute('content'):null};
  let img=null;
  if(R){img=R.image;if(Array.isArray(img))img=img[0];if(img&&typeof img==='object')img=img.url||img.contentUrl}
  img=img||og('og:image');if(img){try{img=new URL(img,url).href}catch(e){img=null}}
  if(!R){const t=og('og:title')||(doc.title||'');return{found:false,draft:{name:decodeHTML(t).split(/\s[|\-–]\s/)[0],url,notes:decodeHTML(og('og:description')||'')},img}}
  const prep=isoMin(R.prepTime),cook=isoMin(R.cookTime),tot=isoMin(R.totalTime);
  const y=[].concat(R.recipeYield||[]).map(String).join(' ').match(/\d+/);
  const steps=flatSteps(R.recipeInstructions).map(t=>({text:t,min:stepMin(t)}));
  return{found:true,img,draft:{name:decodeHTML(R.name),url,cat:guessCat(R.recipeCategory,R.name),servings:y?+y[0]:(S.settings.people||2),
    prep:prep||(tot&&cook?Math.max(0,tot-cook):(tot&&!cook?tot:0)),cook:cook||0,
    ingredients:[].concat(R.recipeIngredient||R.ingredients||[]).map(parseIng).filter(Boolean),steps,notes:decodeHTML(R.description||'')}};

function recipeFromText(txt){
  const L=String(txt||'').replace(/\r/g,'').split('\n').map(s=>s.trim());
  const HI=/^(ingredientes?|ingredients)\b[:\s]*/i,HS=/^(preparaci[oó]n|elaboraci[oó]n|pasos|instrucciones|modo de (preparaci[oó]n|hacerlo)|procedimiento|method|directions|instructions)\b[:\s]*/i,HN=/^(notas?|consejos?|trucos?)\b[:\s]*/i;
  let name='',mode=null,ing=[],st=[],notes=[],serv=null,prep=0,cook=0;const loose=[];
  for(const l of L){if(!l)continue;
    let m;if((m=l.match(/(\d+)\s*(raciones|personas|porciones|comensales|servings)/i))&&l.length<40){serv=+m[1];continue}
    if(/^tiempo/i.test(l)&&l.length<60){const n=stepMin(l)||0;if(/cocci/i.test(l))cook=n;else prep=prep||n;continue}
    if(HI.test(l)){mode='i';const r=l.replace(HI,'');if(r)ing.push(r);continue}
    if(HS.test(l)){mode='s';const r=l.replace(HS,'');if(r)st.push(r);continue}
    if(HN.test(l)){mode='n';const r=l.replace(HN,'');if(r)notes.push(r);continue}
    if(!mode){if(!name&&l.length<80&&!/^\d/.test(l)){name=l;continue}loose.push(l);continue}
    ({i:ing,s:st,n:notes})[mode].push(l);
  }
  if(!ing.length&&!st.length){loose.forEach(l=>{(/^[\s•\-–*·]*(\d|½|¼|¾|un |una |medi)/i.test(l)&&l.length<70&&!/^\d+[.)]\s+[A-ZÁÉÍÓÚ]/.test(l)?ing:st).push(l)})}
  else if(loose.length)(st.length?notes:st).push(...loose);
  const steps=st.map(s=>s.replace(/^(paso\s*)?\d+\s*[.):\-–]\s*/i,'').replace(/^[•\-–*·]\s*/,'')).filter(Boolean).map(t=>({text:t,min:stepMin(t)}));
  return{name,cat:guessCat(null,name),servings:serv||(S.settings.people||2),prep,cook,ingredients:ing.map(parseIng).filter(Boolean),steps,notes:notes.join('\n')};
}

function findPantry(name,u){const n=norm(name),b=toBase(1,u).u;return S.pantry.find(p=>norm(p.name)===n&&toBase(1,p.unit).u===b)}
function addToPantry(name,q,u,loc){
  if(u==='al gusto'){u='ud';q=null}
  const p=findPantry(name,u);
  if(p){if(p.qty!=null&&q!=null){const tot=toBase(p.qty,p.unit).q+toBase(q,u).q;p.qty=Math.round(fromBase(tot,p.unit)*1000)/1000}else if(p.qty!=null&&q==null){/* queda como está */}}
  else{const n=norm(name);const any=S.pantry.find(x=>norm(x.name)===n&&x.qty==null);if(!any)S.pantry.push({id:uid(),name:cap(name.trim()),qty:q,unit:u||'ud',loc:loc||'Despensa'})}
}
function deductPantry(name,q,u){
  const p=findPantry(name,u);if(!p||p.qty==null)return false;
  const tot=Math.max(0,toBase(p.qty,p.unit).q-toBase(q,u).q);p.qty=Math.round(fromBase(tot,p.unit)*1000)/1000;return true;
}

function buildShop(){
  const need=new Map();let meals=0;const from=ui.shopFrom,to=ui.shopTo;
  for(let d=parseD(from);ymd(d)<=to;d=addDays(d,1)){const day=S.plan[ymd(d)];if(!day)continue;
    MEALS.forEach(m=>(day[m.k]||[]).forEach(e=>{if(!e.recipeId)return;const r=getR(e.recipeId);if(!r)return;meals++;
      const f=(e.servings||r.servings||1)/(r.servings||1);
      r.ingredients.forEach(g=>{if(!g.name||!g.name.trim())return;const b=toBase(g.qty==null?null:g.qty*f,g.unit);const key=norm(g.name)+'|'+b.u;
        let it=need.get(key);if(!it){it={key,name:cap(g.name.trim()),u:b.u,q:0,noQty:false,for:new Set(),ou:g.unit};need.set(key,it)}else if(it.ou!==g.unit)it.ou=null;
        if(b.q==null)it.noQty=true;else it.q+=b.q;it.for.add(r.name)})}))}
  const buy=[],have=[];
  for(const it of need.values()){
    const n=norm(it.name);const pants=S.pantry.filter(p=>norm(p.name)===n);
    const any=pants.find(p=>p.qty==null);const same=pants.find(p=>p.qty!=null&&toBase(p.qty,p.unit).u===it.u);
    it.has=same?toBase(same.qty,same.unit).q:0;it.other=!same&&!any&&pants.length?pants[0]:null;
    if(any||(it.u==='al gusto'&&pants.length)){it.toBuy=0;have.push(it);continue}
    if(it.q===0){if(it.has>0){it.toBuy=0;have.push(it)}else{it.toBuy=null;buy.push(it)}continue}
    let tb=it.q-it.has;if(!['g','ml'].includes(it.u))tb=Math.ceil(tb-1e-9);else tb=Math.ceil(tb);
    if(tb<=0){it.toBuy=0;have.push(it)}else{it.toBuy=tb;buy.push(it)}
  }
  const s=(a,b)=>a.name.localeCompare(b.name,'es');buy.sort(s);have.sort(s);
  return{buy,have,meals};
}

const SYNC={on:false,ready:false,code:null,cfg:null,api:null,db:null,last:{},unsubs:[],status:'off',photos:{},pend:false,pushT:null,got:new Set()};

const clean=o=>JSON.parse(JSON.stringify(o));
function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';return JSON.stringify(o)}

function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';const a=new Uint32Array(16);crypto.getRandomValues(a);return [...a].map(x=>A[x%A.length]).join('')}
function parseCfg(t){

}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function inviteLink(){const c={apiKey:SYNC.cfg.apiKey,authDomain:SYNC.cfg.authDomain,projectId:SYNC.cfg.projectId,appId:SYNC.cfg.appId};return `${location.origin}${location.pathname}?cocina=${SYNC.code}&fb=${b64e(JSON.stringify(c))}`}

const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);

function localMaps(){

function queuePush(){if(!SYNC.on)return;clearTimeout(SYNC.pushT);SYNC.pushT=setTimeout(pushChanges,400)}

async function pushChanges(){
  if(!SYNC.on)return;if(!SYNC.ready){SYNC.pend=true;return}
  const{doc,writeBatch,setDoc}=SYNC.api,db=SYNC.db,code=SYNC.code;const m=localMaps();
  let batch=writeBatch(db),n=0;const commits=[];let any=false;
  const flush=()=>{if(n){commits.push(batch.commit());batch=writeBatch(db);n=0}};
  for(const c of COLS){const L=m[c],last=SYNC.last[c];
    for(const id in L){const data=clean(L[id]),j=stable(data);if(last[id]!==j){last[id]=j;any=true;
      if(c==='photos')commits.push(setDoc(doc(db,'cocinas',code,c,id),data));else{batch.set(doc(db,'cocinas',code,c,id),data);if(++n>=400)flush()}}}
    for(const id in last){if(!(id in L)){delete last[id];any=true;batch.delete(doc(db,'cocinas',code,c,id));if(++n>=400)flush()}}
  }
  flush();
  if(any){persistLast();Promise.all(commits).then(()=>{if(SYNC.status!=='ok'){SYNC.status='ok';syncBadge()}}).catch(e=>{console.warn(e);SYNC.status='error';syncBadge()})}
}
function applySet(c,id,d){
  if(c==='recipes'){const i=S.recipes.findIndex(r=>r.id===id);const old=i>=0?S.recipes[i]:null;const r={...d,id,photo:SYNC.photos[id]||(old?old.photo:null)||null};if(i>=0)S.recipes[i]=r;else S.recipes.push(r)}
  else if(c==='photos'){SYNC.photos[id]=d.d;const r=getR(id);if(r)r.photo=d.d}
  else if(c==='days')S.plan[id]=d;
  else if(c==='pantry'||c==='manual'){const a=S[c];const i=a.findIndex(x=>x.id===id);const o={...d,id};if(i>=0)a[i]=o;else a.push(o);if(c==='manual')a.sort((x,y)=>(x.ts||0)-(y.ts||0))}
  else if(c==='checked')S.checked[d.k]=true;
  else if(c==='sections'){S.sections=S.sections||{};S.sections[d.n]=d.s}
  else if(c==='meta'&&id==='settings')S.settings={...S.settings,...d};
}
function applyRemove(c,id){
  if(c==='recipes')S.recipes=S.recipes.filter(r=>r.id!==id);
  else if(c==='photos'){delete SYNC.photos[id];const r=getR(id);if(r)r.photo=null}
  else if(c==='days')delete S.plan[id];
  else if(c==='pantry'||c==='manual')S[c]=S[c].filter(x=>x.id!==id);
  else if(c==='checked')delete S.checked[unId(id)];
  else if(c==='sections'&&S.sections)delete S.sections[unId(id)];
}
let rendT=null;
function remoteChanged(){DB.set('state',JSON.parse(JSON.stringify(S)));persistLast();clearTimeout(rendT);rendT=setTimeout(()=>{render();const c=stack[stack.length-1];if(c&&c.live)refresh()},120)}
function subscribe(){
  const{collection,onSnapshot}=SYNC.api;SYNC.got=new Set();
  COLS.forEach(c=>{SYNC.unsubs.push(onSnapshot(collection(SYNC.db,'cocinas',SYNC.code,c),snap=>{
    let ch=false;
    snap.docChanges().forEach(x=>{const id=x.doc.id;
      if(x.type==='removed'){if(id in SYNC.last[c]||true){delete SYNC.last[c][id];applyRemove(c,id);ch=true}return}
      if(x.doc.metadata&&x.doc.metadata.hasPendingWrites)return;
      const d=x.doc.data();const j=stable(d);if(SYNC.last[c][id]===j&&c!=='photos'&&c!=='recipes'&&c!=='days')return;
      SYNC.last[c][id]=j;applySet(c,id,d);ch=true});
    if(ch)remoteChanged();
    SYNC.status=snap.metadata&&snap.metadata.fromCache?'cache':'ok';syncBadge();
    if(!SYNC.ready){SYNC.got.add(c);if(SYNC.got.size===COLS.length){SYNC.ready=true;if(SYNC.pend){SYNC.pend=false;pushChanges()}}}
  },err=>{console.warn(err);SYNC.status='error';syncBadge()}))});
}
function unsubscribeAll(){SYNC.unsubs.forEach(u=>{try{u()}catch(e){}});SYNC.unsubs=[]}
async function saveSyncConf(){await DB.set('sync',SYNC.code?{code:SYNC.code,cfg:SYNC.cfg}:{cfg:SYNC.cfg})}
async function createKitchen(cfg){
  SYNC.last={};SYNC.photos={};
  await fbConnect(cfg,genCode());
  await withTimeout(SYNC.api.setDoc(SYNC.api.doc(SYNC.db,'cocinas',SYNC.code),{creada:Date.now()}),20000,'Sin respuesta de Firebase. Revisa la conexión y las reglas.');
  await saveSyncConf();SYNC.ready=true;await pushChanges();SYNC.ready=false;subscribe();syncBadge();
}
async function joinKitchen(cfg,code){
  SYNC.last={};SYNC.photos={};
  await fbConnect(cfg,code);
  const snap=await withTimeout(SYNC.api.getDoc(SYNC.api.doc(SYNC.db,'cocinas',code)),20000,'Sin respuesta de Firebase. Revisa la conexión.');
  if(!snap.exists()){unsubscribeAll();Object.assign(SYNC,{on:false,code:null});throw new Error('No existe ninguna cocina con ese código.')}
  const timers=S.timers;S={...blank(),timers};DB.set('state',JSON.parse(JSON.stringify(S)));
  await saveSyncConf();persistLast();subscribe();render();syncBadge();
}
async function leaveKitchen(){unsubscribeAll();clearTimeout(SYNC.pushT);Object.assign(SYNC,{on:false,ready:false,code:null,last:{},status:'off'});await saveSyncConf();await DB.set('synclast',{});syncBadge()}
async function resumeKitchen(conf){
  try{SYNC.last=(await DB.get('synclast'))||{};SYNC.photos=Object.fromEntries(S.recipes.filter(r=>r.photo).map(r=>[r.id,r.photo]));
    SYNC.status='connecting';syncBadge();await fbConnect(conf.cfg,conf.code);subscribe();syncBadge()}
  catch(e){console.warn(e);SYNC.on=false;SYNC.code=conf.code;SYNC.cfg=conf.cfg;SYNC.status='error';syncBadge();setTimeout(()=>{if(!SYNC.on)resumeKitchen(conf)},30000)}
}
function syncBadge(){
  const b=$('#syncb');if(!b)return;
  if(!SYNC.code){b.classList.add('hidden');return}
  b.classList.remove('hidden');
  const t={ok:['☁️ Compartida','ok'],cache:['☁️ Sin conexión · se guardará','wait'],connecting:['☁️ Conectando…','wait'],error:['⚠️ Sin sincronizar','err'],off:['☁️ Compartida','wait']}[SYNC.status]||['☁️','wait'];
  b.textContent=t[0];b.className='syncb '+t[1];
}
function shareBox(){
  if(SYNC.code){
    return `<div class="box"><h3>👥 Cocina compartida</h3>
      <p class="hint" style="margin:0 0 8px">Estado: <b>${{ok:'conectada y al día',cache:'sin conexión (los cambios se envían al volver)',connecting:'conectando…',error:'no se pudo conectar, se reintentará',off:'—'}[SYNC.status]}</b></p>
      <div class="lbl">Código</div><div class="big" style="letter-spacing:.06em">${fmtCode(SYNC.code)}</div>
      <p class="hint">Para invitar a otra persona (o añadir otro dispositivo tuyo), envíale la invitación. Ella abre la app, va a Ajustes ⚙️ → «Unirme» y pega el enlace.</p>
      <div class="btnrow"><button class="btn olive" data-invcopy>📋 Copiar invitación</button>${navigator.share?'<button class="btn" data-invshare>📤 Enviar invitación</button>':''}</div>
      <button class="btn ghost danger block" data-leave>Dejar de compartir en este dispositivo</button></div>`;
  }
  return `<div class="box"><h3>👥 Compartir con otra persona</h3>
    <p class="hint" style="margin:0 0 12px">Comparte el menú, las recetas, la despensa y la lista de la compra. Los cambios aparecen solos en todos los dispositivos conectados.</p>
    <div class="seg" style="width:100%;margin-bottom:14px"><button style="flex:1" data-mode="create" class="${ui.shareMode!=='join'?'on':''}">Crear la cocina</button><button style="flex:1" data-mode="join" class="${ui.shareMode==='join'?'on':''}">Unirme con una invitación</button></div>
    ${ui.shareMode==='join'?`
      <p class="hint" style="margin:0 0 8px">Para quien recibe la invitación (o para tus otros dispositivos).</p>
      <div class="field"><label>Enlace de invitación</label><textarea class="in" id="joinIn" rows="3" placeholder="Pega aquí el enlace de invitación que te enviaron (empieza por https://…?cocina=…)"></textarea></div>
      <button class="btn olive block" data-join>Unirme</button>`:`
      <p class="hint" style="margin:0 0 8px">Hazlo solo una vez, en el dispositivo que ya tiene tus recetas. Lo que hay aquí pasará a la cocina compartida.</p>
      <div class="field"><label>Configuración de Firebase</label><textarea class="in" id="fbcfg" rows="6" placeholder="Pega aquí el bloque de Firebase: const firebaseConfig = { apiKey: …, projectId: …, appId: … }">${SYNC.cfg?esc(JSON.stringify(SYNC.cfg,null,1)):''}</textarea></div>
      <button class="btn primary block" data-create>Crear cocina compartida</button>`}
  </div>`;
}
function inviteText(){return `Te invito a mi cocina compartida en la app Menú 🍽️\n\n1. Abre la app: ${location.origin}${location.pathname}\n2. Ve a Ajustes ⚙️ → «Unirme» y pega este enlace:\n\n${inviteLink()}`}
function mountShare(r){
  const busy=(b,t)=>{b.disabled=true;b.style.opacity=.6;b.textContent=t};
  $$('[data-mode]',r).forEach(b=>b.onclick=()=>{ui.shareMode=b.dataset.mode;refresh()});
  const j=$('[data-join]',r);if(j)j.onclick=async()=>{const txt=$('#joinIn',r).value;
    if(parseCfg(txt)&&!/cocina=/.test(txt)){ui.shareMode='create';refresh();const f=$('#fbcfg');if(f)f.value=txt;toast('Eso es la configuración de Firebase: la he puesto en «Crear la cocina»');return}
    const{code,cfg}=parseInvite(txt);const c=cfg||SYNC.cfg;
    if(!code){toast('Ese enlace de invitación no es válido. Cópialo entero.');return}if(!c){toast('Usa el enlace de invitación completo');return}
    if(!(await ask('Lo que hay ahora en este dispositivo se reemplazará por la cocina compartida.','Unirme',false)))return;
    busy(j,'Conectando…');try{await joinKitchen(c,code);toast('¡Conectada a la cocina compartida!');refresh()}catch(e){toast(e.message||'No se pudo conectar');refresh()}};
  const cr=$('[data-create]',r);if(cr)cr.onclick=async()=>{const raw=$('#fbcfg',r).value;if(/cocina=/.test(raw)){ui.shareMode='join';refresh();const f=$('#joinIn');if(f)f.value=raw;toast('Eso es una invitación: la he puesto en «Unirme»');return}
    const cfg=parseCfg(raw);if(!cfg){toast('No reconozco la configuración. Copia el bloque entero de firebaseConfig.');return}
    busy(cr,'Creando…');try{await createKitchen(cfg);toast('Cocina compartida creada');refresh()}catch(e){console.warn(e);await leaveKitchen().catch(()=>{});SYNC.cfg=cfg;toast(e.message||'No se pudo crear');refresh()}};
  const ic=$('[data-invcopy]',r);if(ic)ic.onclick=async()=>{try{await navigator.clipboard.writeText(inviteText());toast('Invitación copiada')}catch(e){toast('No se pudo copiar')}};
  const is=$('[data-invshare]',r);if(is)is.onclick=async()=>{try{await navigator.share({title:'Cocina compartida · Menú',text:inviteText()})}catch(e){}};
  const lv=$('[data-leave]',r);if(lv)lv.onclick=async()=>{if(!(await ask('Este dispositivo dejará de sincronizarse. Se queda con una copia de los datos actuales.','Dejar de compartir')))return;await leaveKitchen();toast('Ya no se sincroniza');refresh()};
}
async function checkInviteURL(){
  const q=location.search;if(!q.includes('cocina='))return;
  const{code,cfg}=parseInvite(q);try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(!code||!cfg||SYNC.code===code)return;
  if(!(await ask('Te han invitado a una cocina compartida. Lo que hay ahora en este dispositivo se reemplazará por la cocina compartida.','Unirme',false)))return;
  try{await joinKitchen(cfg,code);toast('¡Conectada a la cocina compartida!')}catch(e){toast(e.message||'No se pudo conectar')}
}

/* ===== Arranque ===== */
$$('#tabs button').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;try{localStorage.setItem('menu-tab',ui.tab)}catch(e){}window.scrollTo(0,0);render()});
$('#gear').onclick=openSettings;$('#syncb').onclick=openSettings;
(async()=>{
  await DB.open();
  const st=await DB.get('state');
  S=st&&Array.isArray(st.recipes)?{...blank(),...st}:sampleData();
  if(!st)save();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();drawTimers();tick();checkAlarm();setInterval(tick,1000);
  const sc=await DB.get('sync');if(sc&&sc.cfg)SYNC.cfg=sc.cfg;
  if(sc&&sc.code&&sc.cfg){SYNC.code=sc.code;resumeKitchen(sc)}
  syncBadge();checkInviteURL();
  window.addEventListener('online',()=>{if(SYNC.code&&!SYNC.on)resumeKitchen({code:SYNC.code,cfg:SYNC.cfg})});
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
</script>
